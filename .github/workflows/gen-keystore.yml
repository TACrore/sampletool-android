name: Gen fixed keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate keystore if missing
        run: |
          set -e
          mkdir -p keystores
          KS=keystores/release.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass shenyi123 -keypass shenyi123 \
              -alias shenyi -keyalg RSA -keysize 2048 -validity 20000 \
              -dname "CN=WenZhouShenYi, O=ShenYi, C=CN"
          fi
          ls -l "$KS"
          git config user.name "keystore-bot"
          git config user.email "bot@wzshenyi.com"
          git add keystores/release.keystore
          if git diff --cached --quiet; then
            echo "keystore already committed"
          else
            git commit -m "chore: add fixed release keystore [skip ci]"
            git push
          fi
